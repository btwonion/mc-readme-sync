name: mc-readme-sync
description: Sync a repository Markdown file to CurseForge and Modrinth project descriptions.
author: btwonion

inputs:
  modrinth-api-key:
    description: Modrinth personal access token with PROJECT_WRITE permission. Required when syncing Modrinth.
    required: false
  curseforge-api-key:
    description: CurseForge author API token. Required when syncing CurseForge.
    required: false
  modrinth-project-id:
    description: Modrinth project slug or project ID. Required when syncing Modrinth.
    required: false
  curseforge-project-id:
    description: Numeric CurseForge project ID. Required when syncing CurseForge.
    required: false
  readme-path:
    description: Path to the Markdown file, relative to the repository root.
    required: true
    default: README.md

runs:
  using: node24
  main: dist/index.js

branding:
  icon: refresh-cw
  color: green
